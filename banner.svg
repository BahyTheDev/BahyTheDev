<svg width="900" height="310" viewBox="0 0 900 310" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <clipPath id="name-reveal">
      <rect x="0" y="0" width="0" height="310">
        <animate
          attributeName="width"
          from="0" to="900"
          dur="1.4s" begin="0.7s"
          fill="freeze"
          calcMode="spline"
          keyTimes="0;1"
          keySplines="0.16 1 0.3 1"/>
      </rect>
    </clipPath>

    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(9px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 700; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes drawShort {
        from { stroke-dashoffset: 320; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes goldBreath {
        0%, 100% { opacity: 0.6; }
        50%       { opacity: 1; }
      }

      .top-rule  { stroke-dasharray: 900; animation: drawLine 2.2s cubic-bezier(0.16,1,0.3,1) 0s both; }
      .bot-rule  { stroke-dasharray: 900; animation: drawLine 2.2s cubic-bezier(0.16,1,0.3,1) 0.1s both; }
      .v-bar     { stroke-dasharray: 320; animation: drawShort 1.4s cubic-bezier(0.16,1,0.3,1) 0s both; }
      .label     { animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.25s both; }
      .divider   { stroke-dasharray: 700; animation: drawLine 1.6s cubic-bezier(0.16,1,0.3,1) 1.2s both; }
      .sub       { animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 1.55s both; }
      .tag-1     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1.7s both; }
      .tag-2     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1.85s both; }
      .tag-3     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 2.0s both; }
      .tag-4     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 2.15s both; }
      .tag-5     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 2.3s both; }
      .tag-6     { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 2.45s both; }
      .right-col { animation: fadeIn 1.4s ease-out 2.0s both; }
      .gold-glow { animation: goldBreath 5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="310" fill="#06080f"/>

  <g opacity="0.025" stroke="#c4a86a" stroke-width="0.5">
    <line x1="0" y1="40"  x2="900" y2="40"/>
    <line x1="0" y1="80"  x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
  </g>

  <g opacity="0.35" stroke="#c4a86a" stroke-width="0.8" fill="none">
    <polyline points="18,44 18,26 36,26"/>
    <polyline points="882,44 882,26 864,26"/>
    <polyline points="18,266 18,284 36,284"/>
    <polyline points="882,266 882,284 864,284"/>
  </g>

  <line class="top-rule gold-glow" x1="0" y1="2" x2="900" y2="2" stroke="#c4a86a" stroke-width="1.5"/>
  <line class="bot-rule gold-glow" x1="0" y1="308" x2="900" y2="308" stroke="#c4a86a" stroke-width="1.5"/>
  <line class="v-bar" x1="3" y1="0" x2="3" y2="310" stroke="#c4a86a" stroke-width="2.5"/>

  <text class="label"
    x="52" y="63"
    font-family="'Courier New', Courier, monospace"
    font-size="9.5"
    fill="#c4a86a"
    letter-spacing="4.5"
    opacity="0.85">FULL · STACK · WEB · DEVELOPER</text>

  <g clip-path="url(#name-reveal)">
    <text
      x="44" y="178"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="94"
      font-weight="300"
      fill="#dde1ee"
      letter-spacing="-4">BahyTheDev</text>
  </g>

  <line class="divider" x1="52" y1="198" x2="615" y2="198" stroke="#c4a86a" stroke-width="0.8" opacity="0.65"/>

  <text class="sub"
    x="55" y="222"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13.5"
    font-style="italic"
    fill="#46536b"
    letter-spacing="0.2">Crafting precise, scalable web experiences — front to back.</text>

  <g class="tag-1">
    <rect x="54" y="248" width="102" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="105" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">JAVASCRIPT</text>
  </g>
  <g class="tag-2">
    <rect x="164" y="248" width="104" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="216" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">TYPESCRIPT</text>
  </g>
  <g class="tag-3">
    <rect x="276" y="248" width="76" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="314" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">REACT</text>
  </g>
  <g class="tag-4">
    <rect x="360" y="248" width="76" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="398" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">NEXT.JS</text>
  </g>
  <g class="tag-5">
    <rect x="444" y="248" width="76" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="482" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">PYTHON</text>
  </g>
  <g class="tag-6">
    <rect x="528" y="248" width="60" height="22" rx="1.5" fill="none" stroke="#c4a86a" stroke-width="0.55" opacity="0.5"/>
    <text x="558" y="263" text-anchor="middle"
      font-family="'Courier New', Courier, monospace" font-size="9.5"
      fill="#c4a86a" opacity="0.8" letter-spacing="1.5">CSS</text>
  </g>

  <g class="right-col">
    <line x1="664" y1="52" x2="664" y2="280" stroke="#141926" stroke-width="1"/>

    <text x="684" y="82"
      font-family="'Courier New', Courier, monospace"
      font-size="9" fill="#c4a86a" opacity="0.55" letter-spacing="2">01</text>
    <text x="684" y="100"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14" font-weight="300"
      fill="#8892a4">JavaScript · TypeScript</text>

    <text x="684" y="134"
      font-family="'Courier New', Courier, monospace"
      font-size="9" fill="#c4a86a" opacity="0.55" letter-spacing="2">02</text>
    <text x="684" y="152"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14" font-weight="300"
      fill="#8892a4">React · Next.js</text>

    <text x="684" y="186"
      font-family="'Courier New', Courier, monospace"
      font-size="9" fill="#c4a86a" opacity="0.55" letter-spacing="2">03</text>
    <text x="684" y="204"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14" font-weight="300"
      fill="#8892a4">Python · Node.js</text>

    <text x="684" y="238"
      font-family="'Courier New', Courier, monospace"
      font-size="9" fill="#c4a86a" opacity="0.55" letter-spacing="2">04</text>
    <text x="684" y="256"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14" font-weight="300"
      fill="#8892a4">HTML · CSS</text>

    <text x="684" y="286"
      font-family="'Courier New', Courier, monospace"
      font-size="8.5" fill="#1e2535" letter-spacing="0.8">github.com/BahyTheDev · 2025</text>
  </g>

</svg>
